[env]

# Set default shell
SHELL="/bin/zsh"

# Keep Ansible output clean (no cows)
ANSIBLE_NOCOWS=1

# Global eza configuration directory.
# Default: eza looks for its config files in ~/.config/eza.
EZA_CONFIG_DIR="{{env.HOME}}/.config/eza"

# Disable AWS CLI pager. So command output goes directly to the terminal instead of through 'less'.
AWS_PAGER=""

# Set terminal type to xterm-256color for full 256-color support in terminal apps; only needed if your terminal doesn't set it automatically.
TERM="xterm-256color"

# Set language and locale
LANG="en_US.UTF-8" # Sets the default language and encoding for all programs.
LANGUAGE="en_US:en" # Is used by GNU programs to determine the preferred message language.
#export LC_ALL='en_US.UTF-8' # Should not be set permanently in your shell because it overrides all other locale settings. It’s better to set LC_ALL only temporarily in scripts or commands if needed.

# Set default editor and visual editor to NeoVIM.
# Default: usually vim or nano, but nvim offers more features and better performance.
VISUAL="nvim"
EDITOR="nvim"

# Disable npm scripts from running automatically when installing packages, which can be a security risk if you install untrusted packages.
NPM_CONFIG_IGNORE_SCRIPTS=true

# Global Lefthook configuration file location.
# Default: Lefthook looks for lefthook.yml in the current project directory.
#LEFTHOOK_CONFIG="{{env.HOME}}/.lefthook.yml" # Disabling as it takes precedence over project-specific config and can cause issues if not set up correctly. Lefthook is typically configured on a per-project basis, so it's best to rely on the default behavior of looking for lefthook.yml in the project directory.

# Global Gitleaks configuration file location.
# Default: Gitleaks looks for .gitleaks.toml in the current project directory.
GITLEAKS_CONFIG="{{env.HOME}}/.gitleaks.toml"

# Don’t clear the screen after quitting a manual page.
MANPAGER='less -X'

[tools]
# IaC and Configuration management tools versions
terraform = "1.16.3"
terragrunt = "1.1.5"
ansible = { version = "14.4.0", pipx_args = "--include-deps" }

# Programming languages and tools
ruby = "4.0.7"
node = "26.9.0"
python = "3.14.7"
go = "1.27.1"
rust = "1.98.1"
air = "1.67.4"

# Linters & LSPs
"gem:rubocop" = "1.91.0"
black = "26.5.1"
tflint = "0.64.0"
golangci-lint = "2.13.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"npm:bash-language-server" = "5.7.1"
"npm:prettier" = "3.9.7"

# Security
"gem:brew-vulns" = "0.5.0"
trivy = "0.74.0"

# SAST
"pipx:semgrep" = "1.177.0"

# Package managers
"npm:yarn" = "1.22.22"
pipx = "1.17.3"
uv = "0.12.15"
bun = "1.4.2"

# CI/CD
goreleaser = "2.18.1"
"github:rwx-cloud/cli" = { version = "3.28.0", exe = "rwx" }

# Web testing
"npm:playwright" = "1.63.0"

# Misc
cowsay = "1.6.0"

# File management
fd = "10.5.0"
eza = "0.23.5"
ripgrep = "15.2.0"
zoxide = "0.10.0"
yazi = "26.9.1"
dust = "1.2.5"

# Cloud
aws = { version = "2.36.48", symlink_bins = "true" }
oci = "3.93.0"
gcloud = "585.0.0"

# Monitoring
"aqua:grafana/gcx" = "v1.3.0"
"npm:@sentry/cli" = "3.8.0"


# Containers and K8S
k9s = "0.51.0"
krew = "0.5.0"
helm = "4.3.0"
kubectl = "1.37.0"
kubectx = "0.11.0"
kustomize = "5.8.1"

# AI
"npm:skills" = "1.5.26"

# Password Managers
"npm:@bitwarden/cli" = "2026.8.0"

# Text Editors
"aqua:neovim/neovim" = "0.12.5"

# Parsers
bat = "0.26.1"
yq = "4.53.6"
jq = "1.8.2"
jless = "0.9.0"

# Diff
delta = "0.19.2"
difftastic = "0.70.0"

# Git
lazygit = "0.65.1"
lefthook = "2.1.14"
gitleaks = "8.30.1"
gum = "2.0.1"

# OS
"cargo:procs" = "0.14.12"
bottom = "0.14.9"

# Databases
sqlite = "3.53.4"

[settings]
auto_install = true
idiomatic_version_file_enable_tools = ["go", "node", "python", "uv", "awscli", "terraform"]
idiomatic_version_file_ignore_minimum_versions = true
